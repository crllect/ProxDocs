<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Standard</title>
		<meta name="robots" content="noindex" />
	</head>

	<body>
		<div class="toolbar">
			<div class="toolbar__left">
				<button id="back" type="button" aria-label="Back" title="Back">
					&lt;
				</button>
				<button
					id="forward"
					type="button"
					aria-label="Forward"
					title="Forward"
				>
					&gt;
				</button>
				<button id="reload" type="button">reload</button>
			</div>

			<form id="omnibox" class="omnibox" role="search">
				<input
					id="address"
					type="text"
					name="address"
					placeholder="search or enter address"
					autocomplete="off"
					autocapitalize="off"
					spellcheck="false"
					enterkeyhint="go"
					aria-label="Address"
				/>
			</form>

			<div class="toolbar__right">
				<button data-popup="settings" type="button">settings</button>
			</div>
		</div>

		<div id="popup" class="popup" hidden>
			<section
				class="popup__panel"
				role="dialog"
				aria-modal="true"
				aria-labelledby="popup-title"
			>
				<header class="popup__header">
					<span id="popup-title"></span>
					<button
						id="popup-close"
						type="button"
						aria-label="Close menu"
					>
						close
					</button>
				</header>
				<iframe
					id="popup-frame"
					class="popup__frame"
					title="Menu"
					sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts allow-downloads"
				></iframe>
			</section>
		</div>

		<div id="tabs" class="tabs" role="tablist"></div>

		<p id="status" class="status" role="status" hidden></p>

		<main id="frames" class="frames"></main>

		<script type="module" src="/src/app.ts"></script>
	</body>
</html>
