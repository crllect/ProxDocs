<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>{{PROJECT_TITLE}}</title>
		<!--#if !vite -->
		<link rel="stylesheet" href="/styles.css" />
		<!--#endif -->
		<meta name="robots" content="noindex" />
		<!--#if bootstrap -->
		<script src="/bootstrap-init.js"></script>
		<!--#endif -->
		<!--#if ultraviolet -->
		<script src="/uv/uv.bundle.js"></script>
		<script src="/uv-config.js"></script>
		<script src="/baremux/index.js"></script>
		<!--#endif -->
	</head>

	<body>
		<div class="toolbar">
			<!--#if browserControls -->
			<div class="toolbar__left">
				<button id="back" type="button" aria-label="Back" title="Back">
					&lt;
				</button>
				<button
					id="forward"
					type="button"
					aria-label="Forward"
					title="Forward"
				>
					&gt;
				</button>
				<button id="reload" type="button">reload</button>
			</div>
			<!--#endif -->

			<form id="omnibox" class="omnibox" role="search">
				<input
					id="address"
					type="text"
					name="address"
					placeholder="search or enter address"
					autocomplete="off"
					autocapitalize="off"
					spellcheck="false"
					enterkeyhint="go"
					aria-label="Address"
				/>
			</form>

			<!--#if menuPages -->
			<div class="toolbar__right">
				<!--#if bookmarks -->
				<button id="bookmark" type="button" aria-pressed="false">
					bookmark
				</button>
				<!--#endif -->
				<button id="menu-toggle" type="button" aria-expanded="false">
					menu
				</button>
			</div>
			<!--#endif -->
		</div>

		<!--#if menuPages -->
		<div id="menu" class="menu" hidden>
			<!--#if settings -->
			<!--#if aboutPages -->
			<button data-open="{{INTERNAL_SCHEME}}://settings" type="button">
				settings
			</button>
			<!--#else -->
			<button data-popup="settings" type="button">settings</button>
			<!--#endif -->
			<!--#endif -->
			<!--#if history -->
			<!--#if aboutPages -->
			<button data-open="{{INTERNAL_SCHEME}}://history" type="button">
				history
			</button>
			<!--#else -->
			<button data-popup="history" type="button">history</button>
			<!--#endif -->
			<!--#endif -->
			<!--#if bookmarks -->
			<!--#if aboutPages -->
			<button data-open="{{INTERNAL_SCHEME}}://bookmarks" type="button">
				bookmarks
			</button>
			<!--#else -->
			<button data-popup="bookmarks" type="button">bookmarks</button>
			<!--#endif -->
			<!--#endif -->
			<!--#if aboutPages -->
			<button data-open="{{INTERNAL_SCHEME}}://about" type="button">
				about
			</button>
			<!--#endif -->
		</div>
		<!--#endif -->

		<!--#if popupMenus -->
		<div id="popup" class="popup" hidden>
			<section
				class="popup__panel"
				role="dialog"
				aria-modal="true"
				aria-labelledby="popup-title"
			>
				<header class="popup__header">
					<span id="popup-title"></span>
					<button
						id="popup-close"
						type="button"
						aria-label="Close menu"
					>
						close
					</button>
				</header>
				<iframe
					id="popup-frame"
					class="popup__frame"
					title="Menu"
					sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts allow-downloads"
				></iframe>
			</section>
		</div>
		<!--#endif -->

		<!--#if tabs -->
		<div id="tabs" class="tabs" role="tablist"></div>
		<!--#endif -->

		<p id="status" class="status" role="status" hidden></p>

		<main id="frames" class="frames"></main>

		<script type="module" src="{{APP_ENTRY}}"></script>
	</body>
</html>
